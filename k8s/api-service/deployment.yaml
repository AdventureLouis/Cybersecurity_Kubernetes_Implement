apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: threat-detection
  labels:
    app: api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      serviceAccountName: threat-detection-sa
      containers:
        - name: api-service
          image: "${DOCKERHUB_USERNAME}/threat-detection-api:latest"
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: INFERENCE_SERVICE_URL
              value: "http://inference-service.threat-detection.svc.cluster.local:8080"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
